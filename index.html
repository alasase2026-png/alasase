<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مطعم العسسي - Al-Asase Restaurant</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f9f9f9;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; color: #d32f2f; margin-bottom: 5px; }
    p.subtitle { text-align: center; color: #666; margin-top: 0; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:hover { background-color: #1b5e20; }
    .status { margin-top: 15px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h1>مطعم العسسي</h1>
    <p class="subtitle">تحت إشراف المعلم أبو النور والمعلم أبو أيمن</p>
    <hr>
    
    <div id="app">
      <h3>إرسال طلب تجريبي</h3>
      <button class="btn" id="sendOrderBtn">إرسال الطلب إلى القاعدة</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase الخاصة بمشروع al-asase2026
    const firebaseConfig = {
      apiKey: "AIzaSyAo1YH7Riu1ppzNgUJTdxEtjIFOorAUgKY",
      authDomain: "al-asase2026.firebaseapp.com",
      databaseURL: "https://al-asase2026-default-rtdb.firebaseio.com",
      projectId: "al-asase2026",
      storageBucket: "al-asase2026.firebasestorage.app",
      messagingSenderId: "1094218434468",
      appId: "1:1094218434468:web:734ab80f42c9dc4256e331",
      measurementId: "G-K3Z65SN43V"
    };

    // تهيئة التطبيق والقاعدة
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // دالة إرسال الطلب
    async function createOrder() {
      const statusDiv = document.getElementById('status');
      statusDiv.innerText = "جاري الإرسال...";
      statusDiv.style.color = "#000";

      try {
        const ordersRef = ref(db, "orders");
        await push(ordersRef, {
          items: [
            { name: "صفيحة شامية بالدجاج", quantity: 12 }
          ],
          currency: "SYP",
          timestamp: new Date().toISOString()
        });
        
        statusDiv.innerText = "تم إرسال الطلب بنجاح!";
        statusDiv.style.color = "green";
      } catch (error) {
        console.error("Error adding document: ", error);
        statusDiv.innerText = "حدث خطأ أثناء الإرسال تحقق من قواعد الأمان (Rules)";
        statusDiv.style.color = "red";
      }
    }

    document.getElementById('sendOrderBtn').addEventListener('click', createOrder);
  </script>
</body>
</html>
