<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-data, initial-scale=1.0">
    <title>Al-Assousi Pastries & Pizza</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div class="container mx-auto p-4 max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-orange-600">🍕 قائمة الوجبات (لوحة التحكم الفورية)</h1>
        
        <!-- قائمة الوجبات -->
        <div id="menu-container" class="space-y-4">
            <!-- سيتم تعبئة الوجبات تلقائياً هنا -->
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyBQtbW3AD2nVmbb7igq838c9LZvM3V0k",
            authDomain: "alasase-f65bb.firebaseapp.com",
            projectId: "alasase-f65bb",
            storageBucket: "alasase-f65bb.firebasestorage.app",
            messagingSenderId: "915628891136",
            appId: "1:915628891136:web:1b7195f5503b74af3e4ce5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const menuContainer = document.getElementById('menu-container');

        // جلّب واستمع للتغييرات بشكل فوري (Live Update)
        onSnapshot(collection(db, "meals"), (snapshot) => {
            menuContainer.innerHTML = "";
            if (snapshot.empty) {
                // لو القواعد فارغة، نضع وجبات تجريبية افتراضية أول مرة
                menuContainer.innerHTML = `<p class="text-center text-gray-500">جاري تحميل الوجبات...</p>`;
                return;
            }

            snapshot.forEach((docSnap) => {
                const meal = docSnap.data();
                const mealId = docSnap.id;
                const isAvailable = meal.available;

                const card = document.createElement('div');
                card.className = `p-4 rounded-lg shadow bg-white flex justify-between items-center transition ${isAvailable ? '' : 'opacity-60 bg-red-50'}`;
                
                card.innerHTML = `
                    <div>
                        <h2 class="text-lg font-bold ${isAvailable ? 'text-gray-800' : 'text-red-600'}">${meal.name}</h2>
                        <p class="text-gray-600">${meal.price} ليرة</p>
                        <span class="text-xs px-2 py-1 rounded ${isAvailable ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                            ${isAvailable ? '🟢 متاح للطلب' : '🔴 نفد حالياً'}
                        </span>
                    </div>
                    <div class="flex flex-col gap-2">
                        <button onclick="toggleMeal('${mealId}', ${!isAvailable})" class="px-3 py-1.5 text-sm rounded text-white ${isAvailable ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}">
                            ${isAvailable ? 'جعلها "نفد"' : 'جعلها "متاح"'}
                        </button>
                    </div>
                `;
                menuContainer.appendChild(card);
            });
        });

        // دالة تغيير الحالة وترسلها لـ Firebase فوراً لتظهر عند الزبائن
        window.toggleMeal = async function(id, newStatus) {
            try {
                const mealRef = doc(db, "meals", id);
                await updateDoc(mealRef, { available: newStatus });
            } catch (error) {
                alert("حدث خطأ أثناء التحديث: " + error.message);
            }
        }
    </script>
</body>
</html>
