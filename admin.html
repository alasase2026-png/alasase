<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة إدارة العسسي - تسجيل الدخول</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#e6c567',
                        goldHover: '#f3d57d',
                        brandDark: '#0d0a09',
                        brandCard: '#181311',
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0d0a09; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen bg-brandDark flex items-center justify-center p-4">

    <!-- نافذة تسجيل الدخول عبر Firebase Auth -->
    <div id="authContainer" class="w-full max-w-md bg-brandCard border-2 border-gold/40 rounded-3xl p-6 text-center shadow-2xl">
        <div class="w-16 h-16 rounded-full bg-gold/10 border border-gold/30 text-gold flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
            <i class="fa-solid fa-lock"></i>
        </div>
        <h3 class="text-xl font-black text-gold mb-1">تسجيل دخول الإدارة</h3>
        <p class="text-xs text-gray-400 mb-5">أدخل البريد الإلكتروني وكلمة السر الخاصة بالحساب</p>
        
        <form onsubmit="handleFirebaseLogin(event)" class="space-y-4">
            <div class="text-right">
                <label class="text-xs text-amber-100 font-bold block mb-1">البريد الإلكتروني:</label>
                <input type="email" id="adminEmail" placeholder="admin@example.com" required dir="ltr"
                    class="w-full bg-black/70 border border-gold/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-gold">
            </div>
            
            <div class="text-right">
                <label class="text-xs text-amber-100 font-bold block mb-1">كلمة السر:</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required dir="ltr"
                    class="w-full bg-black/70 border border-gold/30 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-gold">
            </div>

            <div id="loginError" class="hidden text-xs text-red-400 font-bold bg-red-950/50 p-2.5 rounded-xl border border-red-800"></div>

            <button type="submit" id="loginBtn" class="w-full bg-gold hover:bg-goldHover text-brandDark font-black py-3 rounded-xl text-sm shadow-lg transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>تسجيل الدخول</span>
            </button>
        </form>
    </div>

    <!-- لوحة التحكم (تظهر فقط بعد نجاح تسجيل الدخول) -->
    <div id="adminDashboard" class="hidden w-full max-w-5xl bg-brandCard border-2 border-gold/50 rounded-3xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
        <div class="bg-gradient-to-r from-red-950 via-brandCard to-brandCard p-4 border-b border-gold/30 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="w-10 h-10 rounded-xl bg-gold text-brandDark flex items-center justify-center font-black">
                    <i class="fa-solid fa-sliders text-lg"></i>
                </span>
                <div>
                    <h2 class="text-lg font-black text-gold">لوحة تحكم مطعم العسسي</h2>
                    <span id="userStatus" class="text-[10px] text-emerald-400 font-bold flex items-center gap-1">
                        <i class="fa-solid fa-circle-check"></i> تم تسجيل الدخول بنجاح
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <a href="index.html" target="_blank" class="bg-black/60 text-gold text-xs px-3 py-2 rounded-xl border border-gold/30 font-bold hover:bg-gold hover:text-brandDark transition">
                    <i class="fa-solid fa-eye ml-1"></i> معاينة المنيو
                </a>
                <button onclick="handleLogout()" class="bg-red-900/80 hover:bg-red-700 text-white text-xs px-3 py-2 rounded-xl border border-red-500/40 font-bold transition">
                    خروج <i class="fa-solid fa-right-from-bracket mr-1"></i>
                </button>
            </div>
        </div>

        <div class="p-6 overflow-y-auto flex-grow space-y-6">
            <div class="bg-black/50 p-4 rounded-2xl border border-gold/20">
                <h3 class="text-sm font-black text-gold mb-2">أهلاً بك في لوحة الإدارة</h3>
                <p class="text-xs text-gray-300">أنت الآن متصل بحساب Firebase الخاص بك. يمكنك التحكم بالوجبات، التوفر، والأسعار وتحديثها فوراً.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (App + Auth + Database) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
    const firebaseConfig = {
     apiKey: "AIzaSyBQtbW3AD2nVvmbb7igq8k38c9LZvM3V0k",
     authDomain: "alasase-f65bb.firebaseapp.com",
     projectId: "alasase-f65bb",
     storageBucket: "alasase-f65bb.firebasestorage.app",
     messagingSenderId: "915628891136",
     appId: "1:915628891136:web:1b7195f5503b74af3e4ce5",
     measurementId: "G-4RGCR5R0E7"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const liveDB = firebase.database();

    // التحقق التلقائي من حالة تسجيل الدخول عند فتح الصفحة
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
        } else {
            document.getElementById('authContainer').classList.remove('hidden');
            document.getElementById('adminDashboard').classList.add('hidden');
        }
    });

    // دالة تسجيل الدخول
    function handleFirebaseLogin(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const password = document.getElementById('adminPassword').value;
        const errorDiv = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        errorDiv.classList.add('hidden');
        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق...';

        auth.signInWithEmailAndPassword(email, password)
            .then((userCredential) => {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول';
            })
            .catch((error) => {
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> تسجيل الدخول';
                errorDiv.classList.remove('hidden');
                
                if(error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorDiv.innerText = 'البريد الإلكتروني أو كلمة السر غير صحيحة!';
                } else {
                    errorDiv.innerText = 'خطأ في الدخول: ' + error.message;
                }
            });
    }

    // دالة تسجيل الخروج
    function handleLogout() {
        auth.signOut();
    }
    </script>
</body>
</html>
